[build]
  # Keep legacy Trello secrets available to the Edge Function at runtime,
  # while preventing Create React App from serializing them into the bundle.
  command = "env -u REACT_APP_TRELLO_BOARD_KEY -u REACT_APP_TRELLO_TOKEN yarn build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

[[edge_functions]]
  function = "trello-dashboard"
  path = "/api/trello-dashboard"
